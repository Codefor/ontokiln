[workspace]
members = ["crates/pack", "crates/compiler", "crates/reasoner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
oxrdf = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
ontokiln-pack = { path = "crates/pack" }

[package]
name = "ontokiln"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ontokiln-compiler = { path = "crates/compiler" }
ontokiln-pack.workspace = true
ontokiln-reasoner = { path = "crates/reasoner" }
oxrdf.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }

serde_json = "1"
futures-util = {version="0.3", default-features=false,features=["std"]}
libc="0.2"

tempfile.workspace = true
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
spareval = { version = "0.2.9", features = ["sparql-12"] }
spargebra = { version = "0.4", features = ["sparql-12"] }
oxttl = "=0.2.5"
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks", "functions"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
shacl_validation = { version = "=0.2.12", default-features = false }
shacl_ir = "=0.2.9"
mie = "=0.2.9"
prefixmap = "=0.2.9"
iri_s = "=0.2.9"
sparql_service = { version = "=0.2.12", default-features = false }
rudof_rdf = { version = "=0.2.12", default-features = false }

[build-dependencies]
sha2 = "0.10"

[features]
ascent-engine = ["ontokiln-compiler/ascent-engine"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
spareval = { path = "vendor/spareval" }

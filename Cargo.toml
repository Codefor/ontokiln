[workspace]
members = ["crates/pack", "crates/compiler", "crates/reasoner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
oxrdf = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
ontokiln-pack = { path = "crates/pack" }

[package]
name = "ontokiln"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ontokiln-compiler = { path = "crates/compiler" }
ontokiln-pack.workspace = true
ontokiln-reasoner = { path = "crates/reasoner" }
oxrdf.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

serde_json = "1"

[features]
ascent-engine = ["ontokiln-compiler/ascent-engine"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

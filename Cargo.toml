[workspace]
members = ["crates/pack", "crates/compiler", "crates/reasoner"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
oxrdf = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
ontokiln-pack = { path = "crates/pack" }

[package]
name = "ontokiln"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ontokiln-compiler = { path = "crates/compiler" }
ontokiln-pack.workspace = true
ontokiln-reasoner = { path = "crates/reasoner" }
oxrdf.workspace = true
serde_json = "1"
oxigraph = { version = "0.5", default-features = false, features = ["rdf-12"] }
spargebra = { version = "0.4", features = ["sparql-12"] }
sha2 = "0.10"
walkdir = "2"
shacl_validation = { version = "=0.2.12", default-features = false }
shacl_ir = "=0.2.9"
rudof_rdf = { version = "=0.2.12", default-features = false }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[patch.crates-io]
spareval = { path = "vendor/spareval" }

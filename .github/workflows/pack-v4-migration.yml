name: Pack v4 migration smoke
on:
  pull_request:
    paths:
      - crates/pack/src/v4.rs
      - crates/pack/src/lib.rs
      - crates/compiler/src/v4_materialize.rs
      - crates/compiler/src/v4.rs
      - crates/compiler/src/lib.rs
      - crates/compiler/Cargo.toml
      - tests/v4_parity.rs
      - tests/v4_api.rs
      - src/api.rs
      - src/engine.rs
      - src/lib.rs
      - crates/reasoner/src/v4.rs
      - crates/reasoner/src/lib.rs
      - crates/reasoner/Cargo.toml
      - Cargo.lock
      - .github/workflows/pack-v4-migration.yml
permissions:
  contents: read
jobs:
  v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Format v4 overlay source
        run: cargo fmt --all
      - name: Export formatted overlay reasoner
        run: |
          echo BEGIN_FORMATTED_V4_REASONER
          cat crates/reasoner/src/v4.rs
          echo END_FORMATTED_V4_REASONER
      - name: Export formatted engine with derived overlays
        run: |
          echo BEGIN_FORMATTED_V4_ENGINE
          cat src/engine.rs
          echo END_FORMATTED_V4_ENGINE
      - name: Focused v4 package tests
        run: |
          cargo test -p ontokiln-pack v4::tests --locked
          cargo test -p ontokiln-compiler v4::tests --locked
          cargo test -p ontokiln-compiler v4_materialize::tests --locked
          cargo test -p ontokiln-reasoner v4::tests --locked
          cargo test -p ontokiln engine::tests --locked
          cargo test --test v4_parity --locked
          cargo test --test v4_api --locked

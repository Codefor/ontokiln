name: Consumer contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check corpus and formatting
        run: |
          python3 -B tests/fixtures/contract-v1/generate.py --check
          cargo fmt --all --check
      - name: Benchmark oracles and comparison rules
        run: python3 -B -m unittest discover -s tests/benchmarks -v
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Consumer and legacy contracts
        run: |
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
          cargo run --locked --example scenario_lab -- --compare
